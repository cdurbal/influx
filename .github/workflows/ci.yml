# Continuous integration, in parallel jobs (D76):
# - `changes` tells whether anything but documentation changed since the last green run of `main`;
# - `check`: security review markers, migration names, spec index and format, always; then types,
#   lint, the tests without database, the build and its artefact checks;
# - `db`: the local Supabase stack, rebuilt from the migrations, and the database tests (never
#   skipped when code changed);
# - `e2e`: the J5 browser journeys (Playwright, Chromium headless shell only, 5-minute cap on the
#   step) in three shards (L2C-14, docs/mvp/jalons/l2c/e2e.md; L2D-01), each against its own local stack,
#   started in the background while both fronts build;
# - `e2e-merge`: no stack; TK3.1 on the surveys of the shards, then the reports of the three runs
#   merged and the floors of executed cases checked on the whole (L2C-14a);
# - `relay-node-24`: the relay and the origin check on Node 24, the production runtime (C-2).
# A documentation-only push to `main` runs `check`'s cheap steps alone; `production` and pull
# requests always run everything.
# Plan: docs/mvp/21-plan-de-developpement.md §4, J0, J2 point 7, J3-F commit 4 and J5 commit 6.
# Duration budget: 10 minutes for the whole run, journeys included (`18` A-4); no cache, on
# purpose (no cache-poisoning surface): the browser and the images are downloaded at each run.
name: CI

# D71: `production` runs the same checks, and only there do the security review markers block.
on:
  push:
    branches: [main, production]
  pull_request:
    branches: [main, production]

# Least privilege: the workflow only reads the repository.
permissions:
  contents: read

# A newer run on the same branch or pull request cancels the obsolete one.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

jobs:
  # D76: does this push change anything but documentation (`docs/`, `.claude/`, the Markdown files
  # of the root)? Compared with the last SUCCESSFUL run of `main`, not with the previous push: a
  # code push whose run was cancelled (concurrency above) or failed is never hidden by a
  # documentation push after it. Anything unknown (no green run yet, history rewritten, a re-run of
  # the same commit) counts as code.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Reading the past runs of this workflow needs `actions: read`, for this job only.
    permissions:
      contents: read
      actions: read
    outputs:
      code: ${{ steps.detect.outputs.code }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Detect a documentation-only change
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          MAIN_PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          code=true
          if [ "$MAIN_PUSH" = "true" ]; then
            base="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch main --event push \
              --status success --limit 1 --json headSha --jq '.[0].headSha // empty')"
            if [ -n "$base" ] && git cat-file -e "$base^{commit}" 2>/dev/null \
              && git merge-base --is-ancestor "$base" "$GITHUB_SHA"; then
              changed="$(git diff --name-only "$base" "$GITHUB_SHA")"
              echo "Changed since the last green run ($base):"
              printf '%s\n' "$changed"
              if [ -n "$changed" ] && ! printf '%s\n' "$changed" | grep -Eqv '^(docs/|\.claude/|[^/]+\.md$)'; then
                code=false
              fi
            fi
          fi
          echo "code=$code"
          echo "code=$code" >> "$GITHUB_OUTPUT"

  check:
    name: Static checks, unit tests, build
    needs: [changes]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions are pinned to a full commit SHA (the tag is only a mutable label).
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history: the marker check reads every commit of the pushed range.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          # No dependency cache for now: simpler, and no cache-poisoning surface.
          package-manager-cache: false

      # pnpm version comes from the "packageManager" field of package.json.
      - name: Enable corepack
        run: corepack enable

      - name: Show tool versions
        run: |
          node --version
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 03 I-4 and 18 C-8: a commit that changes rights (migrations, expected rights of T2)
      # carries `security-reviewed: <date>`. On a pull request, the range is base..head. J6S-1:
      # every commit since the fixed anchor is checked too, so an unattested commit stays red at
      # each later push. The anchor is the base of the end-of-J5 review range (56b8046..ddcaea7):
      # every later commit went through a recorded grouped review. Never move it forward over a
      # commit that is still unattested.
      # D71 (founder, 2026-10-18): the check blocks on the `production` branch only (push to it, or
      # pull request into it). On `main` it still runs and reports, but a missing marker no longer
      # stops the build nor the staging deployment ("Wait for CI").
      - name: Security review markers
        continue-on-error: ${{ github.ref != 'refs/heads/production' && github.base_ref != 'production' }}
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          I4_ANCHOR: 56b8046083f809ac82399e994f0415d12afc2188
        run: node packages/test-kit/scripts/check-security-review.ts "$BASE_SHA" "$HEAD_SHA" "$I4_ANCHOR"

      # 21 EC-32 and EC-37: staging is migrated by `supabase db push`, which applies new files in
      # name order and never re-reads an applied one. Names, order and immutability are checked.
      - name: Migration file names, order and immutability
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: node packages/test-kit/scripts/check-migrations.ts "$BASE_SHA" "$HEAD_SHA"

      # docs/mvp/INDEX.md gives agents the start line of each spec section: a stale index sends
      # them to the wrong slice. Regenerate it and fail if it differs from the committed one.
      - name: Spec index is up to date
        run: |
          pnpm docs:index
          git diff --exit-code docs/mvp/INDEX.md || { echo "::error::docs/mvp/INDEX.md is stale: run 'pnpm docs:index' and commit it"; exit 1; }

      - name: Format
        run: pnpm format:check

      # What `pnpm check` runs, the database tests aside (job `db`).
      - name: Typecheck
        if: needs.changes.outputs.code == 'true'
        run: pnpm typecheck

      - name: Lint
        if: needs.changes.outputs.code == 'true'
        run: pnpm lint

      - name: Tests without database
        if: needs.changes.outputs.code == 'true'
        run: pnpm test:unit

      - name: Build
        if: needs.changes.outputs.code == 'true'
        run: pnpm build

      - name: Build artefact checks
        if: needs.changes.outputs.code == 'true'
        run: pnpm -r run test:artifacts

  db:
    name: Database tests
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Raised rate limits of the LOCAL Supabase Auth, read by `env()` in supabase/config.toml (EC-38
    # point 4): never a value that `supabase config push` would carry to a hosted project. Every
    # Supabase CLI command refuses to read the config when they are unset (EC-51). Set on the jobs
    # of the local stack only (C5-2): a job that would run the CLI against a hosted project must not
    # inherit them.
    env:
      INFLUX_LOCAL_AUTH_SIGN_IN_LIMIT: "1000"
      INFLUX_LOCAL_AUTH_VERIFY_LIMIT: "1000"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Local Supabase stack (CLI pinned at the root, 21 J1-A): the database, plus Supabase Auth
      # behind its gateway and Mailpit for the findings of J3 commit 7 (21 §4, J3-A: GoTrue is
      # never assumed, it is observed; Mailpit is where a native e-mail would land) and, since
      # L2B-03, Storage. The other containers are not started (time budget).
      # The workstation runs the GoTrue version of staging, which the CLI reads from
      # supabase/.temp/gotrue-version since the J4 link (ignored by Git). The runner is not linked:
      # the same version is pinned here, or the CLI default GoTrue answers differently (EC-57).
      # Keep it equal to the staging version (docs/mvp/runbooks/staging.md), here and in `e2e`.
      - name: Pin the GoTrue version of staging
        run: |
          mkdir -p supabase/.temp
          printf 'v2.197.0' > supabase/.temp/gotrue-version

      - name: Start the local Supabase stack (database, Auth, gateway, Mailpit)
        run: >-
          pnpm exec supabase start
          -x realtime,imgproxy,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      # L2B-03 (D80): Storage is part of the stack, for the brand-logo bucket and the purge task.
      # The CLI already waits for its health check; this proves the gateway routes to it.
      - name: Check that Storage answers through the gateway
        run: curl --fail --silent --show-error --retry 10 --retry-delay 2 --retry-connrefused http://127.0.0.1:54321/storage/v1/status

      # The base is rebuilt from zero in one command (21 J2, "Terminé quand").
      - name: Rebuild the database from the migrations
        run: pnpm exec supabase db reset

      # Fixed test passwords of the three connection roles, local stack only, SCRAM verifiers.
      - name: Set the test passwords of the connection roles
        run: pnpm db:role-passwords

      - name: Database tests
        run: pnpm --filter @influx/api test:db

  # L2C-14, L2D-01: three shards (`--project=chromium` is needed: without it, the `chromium` project, which the
  # TK3.1 project depends on, is never split and every case goes to shard 1). The 5-minute cap of the
  # Playwright step holds for each shard. Playwright cuts the list of cases in consecutive runs of
  # files: with two shards, 1/2 took backoffice.spec.ts (serial, 55 cases) with six other files and
  # ran 396 to 424 s of the job against 300 s for 2/2 (L2CT-5); with three, backoffice.spec.ts
  # ends shard 1 with the five short files before it, the other files fill shards 2 and 3.
  e2e:
    name: Browser journeys (${{ matrix.shard }}/3)
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    # Same local stack as `db`, same raised limits of its Auth (EC-38, EC-51, C5-2).
    env:
      INFLUX_LOCAL_AUTH_SIGN_IN_LIMIT: "1000"
      INFLUX_LOCAL_AUTH_VERIFY_LIMIT: "1000"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Same GoTrue version as `db` and staging (EC-57).
      - name: Pin the GoTrue version of staging
        run: |
          mkdir -p supabase/.temp
          printf 'v2.197.0' > supabase/.temp/gotrue-version

      # D76: the stack takes about two minutes to start (images downloaded, no cache): it starts in
      # the background while both fronts build and Chromium downloads, and is awaited below.
      - name: Start the local Supabase stack in the background
        run: |
          nohup bash -c 'pnpm exec supabase start -x realtime,imgproxy,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor > "$RUNNER_TEMP/supabase-start.log" 2>&1; echo $? > "$RUNNER_TEMP/supabase-start.exit"' > /dev/null 2>&1 &

      # The journeys start both fronts without building them under CI (apps/web/playwright.config.ts).
      - name: Build both fronts
        run: pnpm --filter @influx/web --filter @influx/backoffice run build

      - name: Install the Chromium of Playwright
        # Headless shell only: the config runs devices["Desktop Chrome"] in headless mode, which
        # never launches the full Chromium; it saves its download (about 100 MB).
        run: pnpm --filter @influx/web exec playwright install --with-deps --only-shell chromium

      - name: Wait for the local Supabase stack
        timeout-minutes: 6
        run: |
          while [ ! -f "$RUNNER_TEMP/supabase-start.exit" ]; do sleep 2; done
          cat "$RUNNER_TEMP/supabase-start.log"
          exit "$(cat "$RUNNER_TEMP/supabase-start.exit")"

      # L2B-03 (D80): Storage answers through the gateway before the base is rebuilt.
      - name: Check that Storage answers through the gateway
        run: curl --fail --silent --show-error --retry 10 --retry-delay 2 --retry-connrefused http://127.0.0.1:54321/storage/v1/status

      # The base is rebuilt from zero, as in `db`, so that both jobs test the same base.
      - name: Rebuild the database from the migrations
        run: pnpm exec supabase db reset

      - name: Set the test passwords of the connection roles
        run: pnpm db:role-passwords

      # The four demonstration accounts of example.test (21 J3 commit 11), as on a workstation.
      - name: Create the demonstration accounts
        run: pnpm db:demo-accounts

      # Screen 3 shows the terms in force (21 §J5, commit 6): the last published texts go in first.
      - name: Publish the public documents on the local stack
        run: pnpm --filter @influx/api db:publish-terms -- --latest

      - name: Browser journeys (Playwright)
        # About 45 s locally: a stuck journey must not consume the job. The blob report is merged
        # by `e2e-merge`, which also runs TK3.1 and checks the floors of executed cases.
        timeout-minutes: 5
        working-directory: apps/web
        run: pnpm exec playwright test --project=chromium --shard=${{ matrix.shard }}/3 --reporter=list,blob

      - name: Keep the blob report of the shard
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-blob-${{ matrix.shard }}
          path: apps/web/blob-report
          if-no-files-found: error
          retention-days: 1

      # What the axe passes recorded for TK3.1 (e2e/support/rendering.ts).
      - name: Keep the title surveys of the shard
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-headings-${{ matrix.shard }}
          path: apps/web/test-results/tk3-headings
          if-no-files-found: error
          retention-days: 1

  # L2C-14a: no stack, no browser, no server. TK3.1 reads the surveys of the shards
  # (`--no-deps`: the `chromium` project ran in the shards; E2E_HEADINGS_FROM, see
  # apps/web/playwright.config.ts), then the blobs of the shards and of TK3.1 are merged into the
  # report the floors of executed cases read, as in a single run (`pnpm test:e2e`).
  e2e-merge:
    name: Browser journeys, merged
    needs: [e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download the title surveys of the shards
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: e2e-headings-*
          merge-multiple: true
          path: apps/web/shard-headings

      - name: Download the blob reports of the shards
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: e2e-blob-*
          merge-multiple: true
          path: apps/web/shard-blobs

      - name: TK3.1 on the surveys of the shards
        working-directory: apps/web
        env:
          E2E_HEADINGS_FROM: shard-headings
        run: pnpm exec playwright test --project=charter-headings --no-deps --reporter=list,blob

      - name: Merge the reports and check the floors of executed cases
        working-directory: apps/web
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/e2e-report.json
        run: |
          mkdir all-blobs
          cp shard-blobs/*.zip blob-report/*.zip all-blobs/
          pnpm exec playwright merge-reports --reporter=json all-blobs
          node ../../packages/test-kit/scripts/check-case-floors.ts e2e/case-floors.ts test-results/e2e-report.json

  # C-2 (end-of-J1 security review, 21 J1-J): the relay runs on Node 24 in production (J1-B,
  # Node >= 24.12), while the other jobs run the version of .node-version. What Node's fetch does
  # to the forwarded request (sec-fetch-mode set to cors, origin and sec-fetch-site untouched) is
  # therefore checked on Node 24, against the fake server of the relay tests, together with the
  # origin check of apps/api that reads those two headers only (03 §6.4 A4). No database, no
  # secret, no network beyond the loopback.
  relay-node-24:
    name: Relay on Node 24 (C-2)
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Enable corepack
        run: corepack enable

      # The production floor of J1-B: a runner image that falls behind fails here, visibly.
      - name: Require Node 24.12 or later
        run: |
          node --version
          node -e "const [major, minor] = process.versions.node.split('.').map(Number); if (major !== 24 || minor < 12) { console.error('Node 24.12 or later is required (21 J1-B)'); process.exit(1); }"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Relay of apps/web against the fake server
        run: pnpm --filter @influx/web exec vitest run tests/relay.test.ts

      - name: Relay of apps/backoffice against the fake server
        run: pnpm --filter @influx/backoffice exec vitest run tests/relay.test.ts

      - name: Origin check of apps/api
        run: pnpm --filter @influx/api exec vitest run --project unit tests/request-guards.test.ts

  # 21 §4 J4 point 1 (CI-5): after all the checks, a push to main migrates staging (skipped with
  # them on a documentation-only push, D76: no migration changed since the last green run). The
  # migration role's URL (DIRECT_DATABASE_URL) is a secret of the GitHub environment `staging`
  # only, never a Railway variable. Railway waits for this workflow ("Wait for CI") before deploying, so the
  # schema always precedes the code that reads it. Our supabase/config.toml is NOT read here: the
  # CLI runs in a work directory holding the migrations only, so that no local setting can ever
  # reach the hosted project (C5-2); its settings go by `supabase config push`, by hand
  # (docs/mvp/runbooks/staging.md).
  migrate-staging:
    name: Migrate staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, db, e2e-merge, relay-node-24]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    # One migration run at a time, never cancelled half-way.
    concurrency:
      group: migrate-staging
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # J4S-1: the migration role's URL is given to this step only, never to the install.
      - name: Migrate staging (supabase db push)
        env:
          DIRECT_DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}
        run: |
          if [ -z "$DIRECT_DATABASE_URL" ]; then
            echo "::notice::DIRECT_DATABASE_URL is not set in the staging environment: staging is not migrated (runbook, step 4)."
            exit 0
          fi
          workdir="$(mktemp -d)"
          mkdir -p "$workdir/supabase"
          cp -R supabase/migrations "$workdir/supabase/migrations"
          printf 'project_id = "influx-staging-migrations"\n' > "$workdir/supabase/config.toml"
          pnpm exec supabase db push --db-url "$DIRECT_DATABASE_URL" --workdir "$workdir" --yes

      # 21 EC-62 (C): the public documents of staging, after its migrations. For each document and
      # language, the last entry of apps/api/legal/published.json is published, or its text filled
      # when it was published without (0109), or left as it is: idempotent. The script refuses a
      # database without the staging marker (runbook, step 2) and production. J4S-1: the URL of the
      # migration role is given to this step only. The root certificate of the pooler (EC-34) is
      # public: an environment variable, not a secret.
      - name: Publish the public documents on staging
        env:
          INFLUX_STAGING_MIGRATION_URL: ${{ secrets.DIRECT_DATABASE_URL }}
          STAGING_DATABASE_CA_CERT: ${{ vars.STAGING_DATABASE_CA_CERT }}
        run: |
          if [ -z "$INFLUX_STAGING_MIGRATION_URL" ]; then
            echo "::notice::DIRECT_DATABASE_URL is not set in the staging environment: nothing is published (runbook, step 4)."
            exit 0
          fi
          # Without the pooler's root certificate the TLS check fails (EC-34): warn, never break main.
          if [ -z "$STAGING_DATABASE_CA_CERT" ]; then
            echo "::warning::STAGING_DATABASE_CA_CERT is not set in the staging environment: the public documents are not published (runbook, step 4)."
            exit 0
          fi
          export INFLUX_STAGING_DB_CA_FILE="$(mktemp)"
          printf '%s\n' "$STAGING_DATABASE_CA_CERT" > "$INFLUX_STAGING_DB_CA_FILE"
          pnpm --filter @influx/api db:publish-terms -- --latest --target=staging

  # J9 commit 11 (EC-J9-6, EC-J9-8; D71): the mirror of "Migrate staging" for the `production` branch,
  # which only advances by `git merge --no-ff main` on the founder's explicit agreement. INERT until
  # the founder has created the GitHub environment `production` AND set the repository variable
  # PRODUCTION_MIGRATION_ENABLED to `true` (docs/mvp/runbooks/production.md, step 3). The condition
  # sits on the job, not in a step, on purpose: a job that names `environment: production` CREATES
  # that environment on GitHub when it does not exist, and an unprotected one at that. A skipped job
  # never resolves its environment, so nothing is created, no secret is read. `vars` is the only
  # context the `if` of a job can use for that (`secrets` cannot be read there). Same required jobs
  # as staging; the security review markers (I-4) block in `check` on this branch (D71). Never
  # `railway up`: Railway deploys the branch itself after "Wait for CI". The public documents are NOT
  # published here: publishing the terms in production is the founder's action (EC-62).
  migrate-production:
    name: Migrate production
    if: >-
      github.event_name == 'push'
      && github.ref == 'refs/heads/production'
      && vars.PRODUCTION_MIGRATION_ENABLED == 'true'
    needs: [check, db, e2e-merge, relay-node-24]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    # One migration run at a time, never cancelled half-way.
    concurrency:
      group: migrate-production
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The URL of the migration role is a secret of the GitHub environment `production` only and is
      # given to the steps below, never to the install (J4S-1, CI-5). Without it the job ends green
      # and migrates nothing (second net, behind the condition of the job).
      - name: Require the production marker and refuse the staging marker
        env:
          DIRECT_DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}
          PGSSLMODE: require
        run: |
          if [ -z "$DIRECT_DATABASE_URL" ]; then
            echo "::notice::DIRECT_DATABASE_URL is not set in the production environment: production is not migrated (runbook production, step 3)."
            echo "MIGRATE_PRODUCTION=skip" >> "$GITHUB_ENV"
            exit 0
          fi
          # J9T-2: a positive check, not a deny list. The production base carries its own marker table
          # (runbook production, step 1, created by hand) and never the one of staging (runbook staging,
          # step 1): a URL of staging pasted here is refused even after a reset of staging that lost
          # its marker. Anything else, or a base that cannot be read, is refused.
          marker="$(psql "$DIRECT_DATABASE_URL" --no-psqlrc --tuples-only --no-align \
            --command "select to_regclass('influx_production.environment_marker') is not null and to_regclass('influx_staging.environment_marker') is null")"
          if [ "$marker" != "t" ]; then
            echo "::error::The database does not carry the production marker, or carries the staging one, or could not be read: refusing to migrate it as production."
            exit 1
          fi

      # The pending migrations are listed first (names only), so the run log says what is applied.
      - name: Migrate production (supabase db push)
        if: env.MIGRATE_PRODUCTION != 'skip'
        env:
          DIRECT_DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}
        run: |
          workdir="$(mktemp -d)"
          mkdir -p "$workdir/supabase"
          cp -R supabase/migrations "$workdir/supabase/migrations"
          printf 'project_id = "influx-production-migrations"\n' > "$workdir/supabase/config.toml"
          pnpm exec supabase db push --db-url "$DIRECT_DATABASE_URL" --workdir "$workdir" --dry-run
          pnpm exec supabase db push --db-url "$DIRECT_DATABASE_URL" --workdir "$workdir" --yes
